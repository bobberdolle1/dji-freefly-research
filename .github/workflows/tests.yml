name: tests

# NOTE: this workflow has never executed. The publishing account is locked for
# a billing issue, so GitHub refuses to start jobs ("The job was not started
# because your account is locked due to a billing issue") and every check fails
# with zero steps executed. The workflow is syntactically valid and its
# assertions were reproduced locally, but treat the first real run as
# unverified.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run test suite
        # Runs entirely from repository contents: no proprietary sample, no
        # network access, and no decoded APK required. Two tests skip by design
        # (local-strengthening checks against a sample and a local decompile).
        run: python -m pytest tests/ -v

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the size check resolves blobs through git history, so a
          # shallow checkout would silently report every file as missing.
          fetch-depth: 0

      - name: No proprietary binaries may be committed
        run: |
          if git ls-files | grep -qiE '\.(apk|exe|dll|pyd|so|dex|jar|aar|bin|img|fw|zip|7z|rar|ipa)$'; then
            echo "::error::proprietary or binary file is tracked in the repository"
            git ls-files | grep -iE '\.(apk|exe|dll|pyd|so|dex|jar|aar|bin|img|fw|zip|7z|rar|ipa)$'
            exit 1
          fi
          echo "OK: no binary extensions tracked"

      - name: No large files may be committed
        run: |
          # A bulk enumeration of a proprietary APK once reached 1 MB before
          # being trimmed; this guards against that class of regression.
          offenders=$(git ls-files -z | xargs -0 -I{} sh -c 'test "$(git cat-file -s "$(git rev-parse HEAD:{})" 2>/dev/null || echo 0)" -gt 250000 && echo "{}"' || true)
          if [ -n "$offenders" ]; then
            echo "::error::tracked file exceeds 250 KB:"
            echo "$offenders"
            exit 1
          fi
          echo "OK: no tracked file exceeds 250 KB"

      - name: Whitespace check
        run: git diff --check
